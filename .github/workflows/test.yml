name: Run Jest Tests

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        # Đã xóa dòng cache: 'npm' ở đây để không bị lỗi thiếu file lock

    - name: Install dependencies
      run: npm install

    - name: Run Jest
      run: npm test
